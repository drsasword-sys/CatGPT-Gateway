name: Build Windows sidecar

on:
  workflow_dispatch:
  push:
    branches:
      - feature/windows-sidecar-beta
    tags:
      - "sidecar-v*"

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build native sidecar
        shell: pwsh
        run: ./scripts/build_windows_sidecar.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: CatGPTGateway-Windows-x64-beta
          path: dist/CatGPTGateway-Windows-x64-beta.zip
          if-no-files-found: error
          retention-days: 14
